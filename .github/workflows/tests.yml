name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install compatible dependencies on Python 3.11
        if: matrix.python == '3.11'
        run: python -m pip install -e '.[dev,llm]'
      - name: Install locked dependencies on Python 3.14
        if: matrix.python == '3.14'
        run: python -m pip install -c requirements.lock -e '.[dev,llm]'
      - run: python -m pytest
      - run: python -m financial_research --mode demo --output runs/ci
